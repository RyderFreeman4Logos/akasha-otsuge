name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler libprotobuf-dev nodejs
          protoc --version
          node --version
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Reuse Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - name: Check
        run: bash scripts/check.sh
      - name: Package native Linux archive
        if: github.event_name == 'workflow_dispatch'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          dest=$(mktemp -d "$RUNNER_TEMP/akasha-package.XXXXXXXX")
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          archive="akasha-otsuge-${version}-${GITHUB_SHA:0:12}-linux-$(uname -m).tar.gz"
          python3 scripts/package-linux.py "$dest"
          cd "$dest"
          shopt -s nullglob dotglob
          files=(*)
          (( ${#files[@]} == 2 ))
          test -f "$archive" && test -f "$archive.sha256"
          sha256sum -- "$archive" | cmp - "$archive.sha256"
          echo "archive=$dest/$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$dest/$archive.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload Linux candidate and checksum
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: akasha-otsuge-linux-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ steps.candidate.outputs.archive }}
            ${{ steps.candidate.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
