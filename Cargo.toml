[package]
name = "akasha-otsuge"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Local, traceable cross-agent memory"
repository = "https://github.com/RyderFreeman4Logos/akasha-otsuge"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
rustix = { version = "1.1.6", features = ["process", "fs", "net"] }
surrealkv = { git = "https://github.com/surrealdb/surrealkv", rev = "4338a790c8edc56ef5ea1e46157427af4815be3c" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "net", "io-util", "signal", "macros", "process"] }
toml = "1.1.8"
url = { version = "2.5.8", features = ["serde"] }
zstd = "=0.13.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }

# The selected disk index backend, pinned to the accepted storage ADR.
lancedb = { git = "https://github.com/lancedb/lancedb", rev = "b1b080b97c3edd2fd9f2aae8a3b71ff19487b1f8", default-features = false, features = ["remote"] }
lance-index = "=13.0.0"
lance-io = { version = "=13.0.0", default-features = false }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }

[workspace]
members = ["."]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

# Keep the disk index dependency graph usable on development disks.
[profile.dev]
debug = 0
incremental = false
